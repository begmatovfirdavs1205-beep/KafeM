<article class="product-card"><a class="product-photo" href="{% url 'product_detail' product.slug %}" {% if product.image %}style="background-image:url('{{ product.image.url }}')"{% elif product.image_url %}style="background-image:url('{{ product.image_url }}')"{% endif %}><span class="photo-badge">{{ product.category.name }}</span></a><div class="product-card-body"><a class="product-title" href="{% url 'product_detail' product.slug %}">{{ product.name }}</a><p>{{ product.description|default:"Приготовлено из свежих ингредиентов с заботой о вкусе."|truncatechars:78 }}</p><div class="product-card-bottom"><strong>{{ product.price }} <small>сомони</small></strong><form method="post" action="{% url 'cart_add' product.pk %}">{% csrf_token %}<button class="add-button" type="submit" aria-label="Добавить {{ product.name }} в корзину">+</button></form></div></div></article>
